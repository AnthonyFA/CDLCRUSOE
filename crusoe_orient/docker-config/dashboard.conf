events {}
http {
  include /etc/nginx/mime.types;

  server {
    listen 80;
    server_name localhost;

    rewrite ^/act/(.+)/$ /act/$1 last;
    
    location ^~ /act/ {
      proxy_pass http://crusoe_act_overseer:8080;    
      proxy_http_version 1.1;

      proxy_set_header Host              localhost;    
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }
      
    
      location ^~ /rest/ {
        proxy_pass http://crusoe_observe:8080/rest/;
        proxy_set_header Host localhost;                  
        proxy_read_timeout 60s;
      }


   
    location ^~ /graphql {
      proxy_pass http://crusoe_graphql:4001/graphql;
      proxy_read_timeout 60s;
    }

    
    location ^~ /firewall/ {
      proxy_pass http://crusoe_act_component:8086/firewall/;
      proxy_http_version 1.1;

      proxy_set_header Host              localhost;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }

      
    location ^~ /recommender/ {
      proxy_pass http://recommender:8000/recommender/;
      proxy_set_header Host $host;
      proxy_read_timeout 60s;
    }

    location = /index.html {
      add_header Cache-Control "no-store, must-revalidate";
      try_files $uri =404;
    }
    
    root /usr/share/nginx/html;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
  }
}
